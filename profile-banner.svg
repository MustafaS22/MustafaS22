<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Mustafa's corner of the internet</title>
  <desc id="desc">A violet glass prism, orbital rings, and stars on a dark grid.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#101026"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#8b5cf6" stop-opacity=".49"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x2="1" y2="1">
      <stop stop-color="#f9d8ff"/>
      <stop offset=".36" stop-color="#ab8aff"/>
      <stop offset="1" stop-color="#5136ba"/>
    </linearGradient>
    <linearGradient id="side" x2="0" y2="1">
      <stop stop-color="#6848d2"/>
      <stop offset="1" stop-color="#251e5b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#b8a0ff" stroke-opacity=".105"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="958" height="328" rx="25"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="url(#sky)" d="M0 0h960v330H0z"/>
    <ellipse cx="738" cy="163" rx="244" ry="215" fill="url(#halo)"/>
    <path fill="url(#grid)" d="M0 0h960v330H0z"/>
    <path d="M53 51h54m-54 0v18m854-18h-54m54 0v18M53 279v-18m0 18h54m800 0v-18m0 18h-54" fill="none" stroke="#cbb4ff" stroke-opacity=".52"/>
    <g transform="translate(723 163) rotate(-16)" fill="none" stroke="#c7aaff">
      <ellipse rx="159" ry="48" opacity=".47"/>
      <ellipse rx="181" ry="66" opacity=".34" stroke-dasharray="3 7"/>
      <g fill="#eee4ff" stroke="none">
        <circle r="4.7" cx="159">
          <animateMotion path="M0 0a159 48 0 1 1-318 0a159 48 0 1 1 318 0" dur="11s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <g transform="translate(724 157)" stroke="#e5cdff" stroke-width="1.4" stroke-linejoin="round">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 3;0 -8;0 3" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="6s" repeatCount="indefinite"/>
        <path d="M0-91 71 24 0 93-71 24Z" fill="#a486ff"/>
        <path d="M0-91 71 24 0 49Z" fill="url(#side)"/>
        <path d="M0-91 0 49-71 24Z" fill="url(#front)"/>
        <path d="M0 49 71 24 0 93Z" fill="#6950cd"/>
        <path d="M0 49-71 24 0 93Z" fill="#aa8bf9"/>
      </g>
    </g>
    <g fill="none" stroke="#f5d5ff" stroke-linecap="round">
      <path d="M838 78v28m-14-14h28" stroke-width="2"/>
      <path d="M590 92v14m-7-7h14M859 222v14m-7-7h14">
        <animate attributeName="opacity" values=".9;.24;.9" dur="3.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="807" cy="60" r="2" fill="#fde4ff"/>
    <circle cx="600" cy="223" r="2" fill="#c1a5ff"/>
    <circle cx="886" cy="165" r="2" fill="#c1a5ff"/>
    <text x="75" y="141" fill="#f8f3ff" font-family="Verdana, sans-serif" font-size="56" font-weight="700" letter-spacing="-2">Mustafa's corner</text>
    <text x="75" y="203" fill="#d9bdff" font-family="Verdana, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">of the internet</text>
    <g fill="#cdb0fc">
      <circle cx="81" cy="247" r="3.6"/>
      <circle cx="96" cy="247" r="3.6" opacity=".65"/>
      <circle cx="111" cy="247" r="3.6" opacity=".32"/>
    </g>
  </g>
  <rect x="1" y="1" width="958" height="328" rx="25" fill="none" stroke="#514276"/>
</svg>
